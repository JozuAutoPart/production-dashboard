<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Set-Up Dashboard & Form</title>
    <!-- Bootstrap 5 CSS เพื่อความสวยงามและใช้งานง่าย -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 500px; }
        thead th { position: sticky; top: 0; background: #343a40 !important; color: white; z-index: 1; }
    </style>
</head>
<body>

    <div class="container my-4">
        <!-- Dashboard Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="p-4 bg-dark text-white rounded-3 shadow">
                    <h2>📊 Die Set-Up Dashboard & Management</h2>
                    <p class="mb-0">ระบบบันทึกและควบคุมการตั้งค่าแม่พิมพ์ (Process 1 - 11)</p>
                </div>
            </div>
        </div>

        <!-- Form Input Card -->
        <div class="card p-4 mb-4">
            <h4 class="mb-3 text-primary">📝 บันทึกข้อมูล Die Set-Up</h4>
            <form id="dieSetupForm">
                <!-- ข้อมูลทั่วไป -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Part No.</label>
                        <input type="text" class="form-control" id="partNo" required placeholder="ระบุรหัสชิ้นงาน">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Lot No.</label>
                        <input type="text" class="form-control" id="lotNo" required placeholder="ระบุหมายเลขล็อต">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Material (ขนาดวัตถุดิบ)</label>
                        <input type="text" class="form-control" id="material" required placeholder="เช่น SPCC 1.2x100mm">
                    </div>
                </div>

                <!-- ตารางบันทึก Process 1 - 11 -->
                <h5 class="mb-3 text-secondary">⚙️ พารามิเตอร์ตามกระบวนการ (Process 1 - 11)</h5>
                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-striped align-middle text-center">
                        <thead>
                            <tr>
                                <th style="width: 10%;">Process</th>
                                <th style="width: 20%;">Machine No.</th>
                                <th style="width: 25%;">Air Pressure (Bar/PSI)</th>
                                <th style="width: 20%;">Stroke (SPM)</th>
                                <th style="width: 25%;">Die Height (DH)</th>
                            </tr>
                        </thead>
                        <tbody id="processTableBody">
                            <!-- จะถูกสร้างด้วย JavaScript สำหรับ Process 1-11 -->
                        </tbody>
                    </table>
                </div>

                <!-- ปุ่มบันทึก -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success btn-lg px-5" id="submitBtn">💾 บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script สำหรับสร้างแถว Process 1-11 และส่งข้อมูลไป Apps Script -->
    <script>
        // กำหนด URL ของ Google Apps Script ที่ได้จากการ Deploy Web App มาใส่ตรงนี้
        const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        // สร้างตาราง Process 1 ถึง 11 อัตโนมัติเมื่อโหลดหน้าเว็บ
        document.addEventListener("DOMContentLoaded", function() {
            const tbody = document.getElementById("processTableBody");
            
            for (let i = 1; i <= 11; i++) {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="fw-bold bg-light">Process ${i}</td>
                    <td><input type="text" class="form-control form-control-sm text-center" name="machineNo_${i}" placeholder="MC-0${i}" required></td>
                    <td><input type="text" class="form-control form-control-sm text-center" name="airPressure_${i}" placeholder="เช่น 5.5 Bar" required></td>
                    <td><input type="text" class="form-control form-control-sm text-center" name="strokeSPM_${i}" placeholder="เช่น 45" required></td>
                    <td><input type="text" class="form-control form-control-sm text-center" name="dieHeight_${i}" placeholder="เช่น 250 mm" required></td>
                `;
                tbody.appendChild(tr);
            }
        });

        // จัดการเมื่อกดปุ่มบันทึก
        document.getElementById("dieSetupForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (WEB_APP_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
                alert("กรุณานำ Web App URL จาก Google Apps Script มาใส่ในตัวแปร WEB_APP_URL ก่อนใช้งานจริงครับ!");
                return;
            }

            let submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "กำลังบันทึก...";

            // รวบรวมข้อมูลทั่วไป
            let partNo = document.getElementById("partNo").value;
            let lotNo = document.getElementById("lotNo").value;
            let material = document.getElementById("material").value;

            // รวบรวมข้อมูล Process 1 - 11 เป็น Array
            let processes = [];
            for (let i = 1; i <= 11; i++) {
                processes.push({
                    processNo: `Process ${i}`,
                    machineNo: document.querySelector(`[name="machineNo_${i}"]`).value,
                    airPressure: document.querySelector(`[name="airPressure_${i}"]`).value,
                    strokeSPM: document.querySelector(`[name="strokeSPM_${i}"]`).value,
                    dieHeight: document.querySelector(`[name="dieHeight_${i}"]`).value
                });
            }

            let payload = {
                partNo: partNo,
                lotNo: lotNo,
                material: material,
                user: "มิว", // หรือดึงชื่อผู้ใช้งานระบบ
                processes: processes
            };

            // ส่งข้อมูลไปที่ Google Apps Script ผ่าน Fetch API
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // ป้องกันปัญหา CORS policy ของ Google Script
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("✅ บันทึกข้อมูล Die Set-Up สำเร็จเรียบร้อย!");
                document.getElementById("dieSetupForm").reset();
            })
            .catch((error) => {
                console.error("Error:", error);
                alert("❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "💾 บันทึกข้อมูล";
            });
        });
    </script>
</body>
</html>
