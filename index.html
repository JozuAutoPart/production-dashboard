<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Mold Setup & QC Verification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 650px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        h2, h3 { color: #333; text-align: center; }
        .step-box { display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
        .active-step { display: block; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; display: inline-block; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบจัดการ Set-Up แม่พิมพ์ & QC Check</h2>
    <hr>

    <!-- STEP 1: บันทึกการ Set-Up -->
    <div id="step1" class="step-box active-step">
        <h3>Step 1: บันทึกข้อมูลการ Set-Up</h3>
        <div class="form-group">
            <label>รหัสเครื่องจักร (Machine):</label>
            <input type="text" id="machine_code" value="MC-01">
        </div>
        <div class="form-group">
            <label>รหัสแม่พิมพ์ (Mold Code):</label>
            <input type="text" id="mold_code" value="MLD-2026-001">
        </div>
        <div class="form-group">
            <label>ค่าพารามิเตอร์ติดตั้งจริง (เช่น แรงหนีบ/อุณหภูมิ):</label>
            <input type="number" id="actual_param" placeholder="ระบุค่าที่ตั้งจริง">
        </div>
        <button onclick="submitSetup()">บันทึก Set-Up และส่งตรวจสอบ QC</button>
    </div>

    <!-- STEP 2: ฝั่ง QC ตรวจสอบ (QC Check) -->
    <div id="step2" class="step-box">
        <h3>Step 2: ผลการตรวจสอบจาก QC (QC Inspection)</h3>
        <p><strong>สถานะปัจจุบัน:</strong> <span id="setupStatus" class="status-badge">รอการตรวจสอบ</span></p>
        
        <div class="form-group">
            <label>ผลการตรวจสอบชิ้นงานแรก (First Article Inspection):</label>
            <select id="qc_result">
                <option value="PASS">ผ่าน (PASS) - อนุญาตให้ผลิต</option>
                <option value="FAIL">ไม่ผ่าน (FAIL) - ต้องปรับปรุงค่า Set-Up ใหม่</option>
            </select>
        </div>
        <div class="form-group">
            <label>หมายเหตุ / ข้อเสนอแนะจาก QC:</label>
            <input type="text" id="qc_remark" placeholder="เช่น ขนาดรูปร่างได้ตามมาตรฐาน">
        </div>
        <button class="btn-success" onclick="submitQC()">ยืนยันผล QC</button>
    </div>

    <!-- STEP 3: เสร็จสิ้น -->
    <div id="step3" class="step-box">
        <h3>Step 3: สรุปผลสถานะการทำงาน</h3>
        <div id="finalResult" style="text-align: center; font-size: 18px; font-weight: bold; padding: 20px;"></div>
    </div>
</div>

<script>
    let currentData = {};

    function submitSetup() {
        currentData.machine = document.getElementById('machine_code').value;
        currentData.mold = document.getElementById('mold_code').value;
        currentData.param = document.getElementById('actual_param').value;

        if(!currentData.param) {
            alert('กรุณากรอกค่าพารามิเตอร์ให้ครบถ้วน');
            return;
        }

        // เปลี่ยนหน้าไปส่วนของ QC Check
        document.getElementById('step1').classList.remove('active-step');
        document.getElementById('step2').classList.add('active-step');
        document.getElementById('setupStatus').innerText = "รอ QC ตรวจสอบ";
        document.getElementById('setupStatus').className = "status-badge";
    }

    function submitQC() {
        const qcDecision = document.getElementById('qc_result').value;
        const remark = document.getElementById('qc_remark').value;

        document.getElementById('step2').classList.remove('active-step');
        document.getElementById('step3').classList.add('active-step');

        const finalDiv = document.getElementById('finalResult');
        if(qcDecision === 'PASS') {
            finalDiv.innerHTML = `<span style="color: green;">✔ QC ผ่าน (PASS)<br>เครื่องจักร ${currentData.machine} สามารถเริ่มเดินเครื่องผลิตได้ทันที!</span>`;
        } else {
            finalDiv.innerHTML = `<span style="color: red;">✖ QC ไม่ผ่าน (FAIL)<br>กรุณากลับไปแก้ไข Set-Up แม่พิมพ์ใหม่ (${remark})</span>`;
        }
    }
</script>

</body>
</html>
