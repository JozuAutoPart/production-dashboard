<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Mold Setup & QC to Google Sheets</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 15px; }
        button:hover { background-color: #218838; }
        #loading { display: none; text-align: center; color: #007bff; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบ Set-Up & QC บันทึกเข้า Google Sheets</h2>
    
    <form id="moldForm">
        <div class="form-group">
            <label>รหัสเครื่องจักร (Machine Code):</label>
            <input type="text" id="machine_code" value="MC-01" required>
        </div>
        <div class="form-group">
            <label>รหัสแม่พิมพ์ (Mold Code):</label>
            <input type="text" id="mold_code" value="MLD-2026-001" required>
        </div>
        <div class="form-group">
            <label>ค่าพารามิเตอร์ติดตั้งจริง:</label>
            <input type="number" id="actual_param" placeholder="ระบุค่าที่ตั้งจริง" required>
        </div>
        <div class="form-group">
            <label>ผลการตรวจสอบ QC (First Article Inspection):</label>
            <select id="qc_result">
                <option value="PASS">PASS (ผ่าน - อนุญาตผลิต)</option>
                <option value="FAIL">FAIL (ไม่ผ่าน - ต้องแก้ไข)</option>
            </select>
        </div>
        <div class="form-group">
            <label>หมายเหตุ / ข้อเสนอแนะ:</label>
            <input type="text" id="qc_remark" placeholder="เช่น ขนาดปกติ ไม่มีรอย">
        </div>
        
        <button type="submit">บันทึกข้อมูลลง Google Sheet</button>
        <div id="loading">กำลังบันทึกข้อมูล... กรุณารอสักครู่</div>
    </form>
</div>

<script>
    // ⚠️ นำ Web App URL ที่ได้จากการ Deploy Google Apps Script มาใส่ตรงนี้
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxe7ROJEhzbIyUJv8g4pysPkBUuk3gd9X8DhrOTjRL7WAhyR0BcqYAr5gCgvGDu7TIi/exec';

    document.getElementById('moldForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        document.getElementById('loading').style.display = 'block';

        const data = {
            machine_code: document.getElementById('machine_code').value,
            mold_code: document.getElementById('mold_code').value,
            actual_param: document.getElementById('actual_param').value,
            qc_result: document.getElementById('qc_result').value,
            qc_remark: document.getElementById('qc_remark').value
        };

        try {
            const response = await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // สำคัญมากสำหรับการยิงข้ามโด메นไป Google Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            document.getElementById('loading').style.display = 'none';
            alert('บันทึกข้อมูลลง Google Sheet สำเร็จเรียบร้อย!');
            document.getElementById('moldForm').reset();
            
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert('เกิดข้อผิดพลาดในการบันทึก: ' + error);
        }
    });
</script>

</body>
</html>
