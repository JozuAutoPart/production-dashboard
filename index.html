<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #38bdf8;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .nav-pills .nav-link {
            color: #94a3b8;
            border-radius: 8px;
            font-weight: 500;
        }
        .nav-pills .nav-link.active {
            background-color: #0284c7;
            color: #ffffff;
        }
        .btn-primary {
            background-color: #0284c7;
            border-color: #0284c7;
        }
        .btn-primary:hover {
            background-color: #0369a1;
            border-color: #0369a1;
        }
        .table-dark {
            --bs-table-bg: #1e293b;
            --bs-table-border-color: #334155;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="p-3 p-md-4">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container-fluid max-width-lg">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-chart-column text-info me-2"></i>Production Management</h3>
                <p class="text-secondary small mb-0">ระบบวางแผนและบันทึกการผลิตสายไลน์</p>
            </div>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadData()">
                <i class="fa-solid fa-rotate me-1"></i> รีเฟรช
            </button>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills nav-fill mb-4 p-1 card flex-row" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-dashboard" data-bs-toggle="pill" data-bs-target="#content-dashboard" type="button" role="tab">
                    <i class="fa-solid fa-chart-line me-2"></i>Dashboard
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-plan" data-bs-toggle="pill" data-bs-target="#content-plan" type="button" role="tab">
                    <i class="fa-solid fa-pushpin me-2"></i>วางแผน (Planning)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-actual" data-bs-toggle="pill" data-bs-target="#content-actual" type="button" role="tab">
                    <i class="fa-solid fa-gear me-2"></i>บันทึกการผลิต (Actual)
                </button>
            </li>
        </ul>

        <!-- Tab Contents -->
        <div class="tab-content" id="pills-tabContent">
            
            <!-- Dashboard Tab -->
            <div class="tab-pane fade show active" id="content-dashboard" role="tabpanel">
                <div class="card p-3 mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small text-secondary">กรองสายการผลิต (Line)</label>
                            <select id="filterLine" class="form-select" onchange="renderDashboard()">
                                <option value="ALL">ทุกสายการผลิต</option>
                                <option value="Line A">Line A</option>
                                <option value="Line B">Line B</option>
                                <option value="Line C">Line C</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card p-3">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-list-check me-2 text-warning"></i>รายการสถานะการผลิต</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Line</th>
                                    <th>Part No.</th>
                                    <th>Lot No.</th>
                                    <th>Plan Qty</th>
                                    <th>Actual Qty</th>
                                    <th>Defect Qty</th>
                                    <th>Progress</th>
                                    <th>Operator</th>
                                </tr>
                            </thead>
                            <tbody id="dashboardTableBody">
                                <tr>
                                    <td colspan="8" class="text-center text-secondary py-4">กำลังโหลดข้อมูล...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Planning Tab -->
            <div class="tab-pane fade" id="content-plan" role="tabpanel">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4"><i class="fa-solid fa-thumbtack text-danger me-2"></i>ฟอร์มวางแผนการผลิต (Production Planning)</h5>
                    <form id="planForm" onsubmit="submitPlan(event)">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label small text-secondary">สายการผลิต (Line)</label>
                                <select id="planLine" class="form-select" required>
                                    <option value="Line A">Line A</option>
                                    <option value="Line B">Line B</option>
                                    <option value="Line C">Line C</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Part No.</label>
                                <select id="planPartNo" class="form-select" required>
                                    <option value="">-- โปรดเลือก Part No. --</option>
                                    <option value="J0701-17620-Z1T-8000-20">J0701-17620-Z1T-8000-20</option>
                                    <option value="J0701-17620-Z1T-8000-21">J0701-17620-Z1T-8000-21</option>
                                    <option value="J0701-17620-Z1T-8000-23">J0701-17620-Z1T-8000-23</option>
                                    <option value="J0701-17620-Z1T-8000-25">J0701-17620-Z1T-8000-25</option>
                                    <option value="J0802-17622-ZOT-8200">J0802-17622-ZOT-8200</option>
                                    <option value="J0804-17625-Z4H-3000">J0804-17625-Z4H-3000</option>
                                    <option value="J0804-17636-Z4H-0100">J0804-17636-Z4H-0100</option>
                                    <option value="J0803-17620-899-8000-20">J0803-17620-899-8000-20</option>
                                    <option value="J0803-17620-899-8000-21">J0803-17620-899-8000-21</option>
                                    <option value="J0803-17620-899-8000-22">J0803-17620-899-8000-22</option>
                                    <option value="J0803-17625-434-3000">J0803-17625-434-3000</option>
                                    <option value="J0803-17620-899-8000-23">J0803-17620-899-8000-23</option>
                                    <option value="J0804-17621-Z4H-3100">J0804-17621-Z4H-3100</option>
                                    <option value="J1901-17622-Z4H-9100">J1901-17622-Z4H-9100</option>
                                    <option value="J1701-17625-K59K-T110-Y1">J1701-17625-K59K-T110-Y1</option>
                                    <option value="J1201-17628-K20-9010-Y1">J1201-17628-K20-9010-Y1</option>
                                    <option value="J1201-17623-K20-A110-Y1">J1201-17623-K20-A110-Y1</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Lot No.</label>
                                <input type="text" id="planLotNo" class="form-control" placeholder="เช่น L6907-01" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">วันที่สั่งผลิต (Order Date)</label>
                                <input type="date" id="planOrderDate" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">วันที่ต้องการสินค้า (Target Date)</label>
                                <input type="date" id="planTargetDate" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">จำนวนแผน (Plan Qty / Pcs)</label>
                                <input type="number" id="planQty" class="form-control" value="0" min="1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">ชื่อผู้วางแผน (Planner Name)</label>
                                <input type="text" id="plannerName" class="form-control" placeholder="ระบุชื่อผู้ตั้งแผน" required>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                    <i class="fa-solid fa-pushpin me-2"></i>บันทึกแผนการผลิต (Save Plan)
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Actual Record Tab -->
            <div class="tab-pane fade" id="content-actual" role="tabpanel">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4"><i class="fa-solid fa-pen-to-square text-success me-2"></i>ฟอร์มบันทึกผลการผลิต (Production Actual)</h5>
                    <form id="actualForm" onsubmit="submitActual(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">สายการผลิต (Line)</label>
                                <select id="actualLine" class="form-select" required>
                                    <option value="Line A">Line A</option>
                                    <option value="Line B">Line B</option>
                                    <option value="Line C">Line C</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">วันที่บันทึก (Actual Date)</label>
                                <input type="date" id="actualDate" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Part No.</label>
                                <select id="actualPartNo" class="form-select" required>
                                    <option value="">-- โปรดเลือก Part No. --</option>
                                    <option value="J0701-17620-Z1T-8000-20">J0701-17620-Z1T-8000-20</option>
                                    <option value="J0701-17620-Z1T-8000-21">J0701-17620-Z1T-8000-21</option>
                                    <option value="J0701-17620-Z1T-8000-23">J0701-17620-Z1T-8000-23</option>
                                    <option value="J0701-17620-Z1T-8000-25">J0701-17620-Z1T-8000-25</option>
                                    <option value="J0802-17622-ZOT-8200">J0802-17622-ZOT-8200</option>
                                    <option value="J0804-17625-Z4H-3000">J0804-17625-Z4H-3000</option>
                                    <option value="J0804-17636-Z4H-0100">J0804-17636-Z4H-0100</option>
                                    <option value="J0803-17620-899-8000-20">J0803-17620-899-8000-20</option>
                                    <option value="J0803-17620-899-8000-21">J0803-17620-899-8000-21</option>
                                    <option value="J0803-17620-899-8000-22">J0803-17620-899-8000-22</option>
                                    <option value="J0803-17625-434-3000">J0803-17625-434-3000</option>
                                    <option value="J0803-17620-899-8000-23">J0803-17620-899-8000-23</option>
                                    <option value="J0804-17621-Z4H-3100">J0804-17621-Z4H-3100</option>
                                    <option value="J1901-17622-Z4H-9100">J1901-17622-Z4H-9100</option>
                                    <option value="J1701-17625-K59K-T110-Y1">J1701-17625-K59K-T110-Y1</option>
                                    <option value="J1201-17628-K20-9010-Y1">J1201-17628-K20-9010-Y1</option>
                                    <option value="J1201-17623-K20-A110-Y1">J1201-17623-K20-A110-Y1</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Lot No.</label>
                                <input type="text" id="actualLotNo" class="form-control" placeholder="เช่น L6907-01" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary">จำนวนผลิตได้ (Actual Qty)</label>
                                <input type="number" id="actualQty" class="form-control" value="0" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary">จำนวนของเสีย (Defect Qty)</label>
                                <input type="number" id="defectQty" class="form-control" value="0" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-secondary">ชื่อผู้บันทึก (Operator Name)</label>
                                <input type="text" id="operatorName" class="form-control" placeholder="ระบุชื่อพนักงาน" required>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                    <i class="fa-solid fa-floppy-disk me-2"></i>บันทึกผลการผลิต (Save Actual)
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // URL ของ Google Apps Script Web App
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqV4mE6VLYdbFna04S-IkgnxDn7EGQU1TdjF0Z63cSbd51sDBHLxzHaMGw6LMpB1MU/exec"; 

        let globalData = [];

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) overlay.classList.remove('d-none');
            else overlay.classList.add('d-none');
        }

        function setDefaultDates() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('planOrderDate').value = today;
            document.getElementById('planTargetDate').value = today;
            document.getElementById('actualDate').value = today;
        }

        async function loadData() {
            showLoading(true);
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                globalData = await response.json();
                renderDashboard();
            } catch (err) {
                console.error("Error loading data:", err);
            } finally {
                showLoading(false);
            }
        }

        function renderDashboard() {
            const lineFilter = document.getElementById('filterLine').value;
            const tbody = document.getElementById('dashboardTableBody');
            tbody.innerHTML = '';

            let filtered = globalData;
            if (lineFilter !== 'ALL') {
                filtered = globalData.filter(item => item.line === lineFilter);
            }

            if (!filtered || filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-secondary py-4">ไม่พบข้อมูลการผลิต</td></tr>';
                return;
            }

            filtered.forEach(item => {
                const plan = Number(item.planQty) || 0;
                const actual = Number(item.actualQty) || 0;
                const percent = plan > 0 ? Math.min(Math.round((actual / plan) * 100), 100) : 0;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge bg-secondary">${item.line || '-'}</span></td>
                    <td class="fw-bold text-info">${item.planPartNo || item.actualPartNo || '-'}</td>
                    <td>${item.planLotNo || item.actualLotNo || '-'}</td>
                    <td>${plan.toLocaleString()}</td>
                    <td class="text-success fw-bold">${actual.toLocaleString()}</td>
                    <td class="text-danger">${(Number(item.defectQty) || 0).toLocaleString()}</td>
                    <td style="width: 150px;">
                        <div class="progress" style="height: 15px; background-color: #0f172a;">
                            <div class="progress-bar ${percent >= 100 ? 'bg-success' : 'bg-info'}" 
                                 role="progressbar" style="width: ${percent}%;">
                                 ${percent}%
                            </div>
                        </div>
                    </td>
                    <td><small class="text-secondary">${item.operator || item.planner || '-'}</small></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function submitPlan(e) {
            e.preventDefault();
            showLoading(true);

            const payload = {
                action: "addProductionLog",
                data: {
                    line: document.getElementById('planLine').value,
                    planPartNo: document.getElementById('planPartNo').value,
                    planLotNo: document.getElementById('planLotNo').value,
                    planOrderDate: document.getElementById('planOrderDate').value,
                    planTargetDate: document.getElementById('planTargetDate').value,
                    planQty: document.getElementById('planQty').value,
                    planner: document.getElementById('plannerName').value
                }
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('บันทึกแผนการผลิตเรียบร้อยแล้ว!');
                document.getElementById('planForm').reset();
                setDefaultDates();
                setTimeout(loadData, 1500);
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                showLoading(false);
            }
        }

        async function submitActual(e) {
            e.preventDefault();
            showLoading(true);

            const payload = {
                action: "addProductionLog",
                data: {
                    line: document.getElementById('actualLine').value,
                    actualDate: document.getElementById('actualDate').value,
                    actualPartNo: document.getElementById('actualPartNo').value,
                    actualLotNo: document.getElementById('actualLotNo').value,
                    actualQty: document.getElementById('actualQty').value,
                    defectQty: document.getElementById('defectQty').value,
                    operator: document.getElementById('operatorName').value
                }
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('บันทึกผลการผลิตเรียบร้อยแล้ว!');
                document.getElementById('actualForm').reset();
                setDefaultDates();
                setTimeout(loadData, 1500);
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                showLoading(false);
            }
        }

        window.onload = () => {
            setDefaultDates();
            loadData();
        };
    </script>
</body>
</html>
