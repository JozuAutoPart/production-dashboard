<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All Lines Plan vs Actual Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 12px; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    /* Header */
    .header { background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .btn-refresh { background: #334155; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-refresh:hover { background: #475569; }

    /* Grand Total Overview Banner */
    .overview-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px; border-radius: 16px; border: 1px solid #38bdf8; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.1); }
    .overview-title { font-size: 14px; font-weight: 800; color: #94a3b8; margin-bottom: 10px; }
    .overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .total-card { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
    .total-title { font-size: 10px; color: #94a3b8; font-weight: bold; }
    .total-val { font-size: 16px; font-weight: 800; margin-top: 4px; }

    /* Lines Comparison Grid */
    .section-title { font-size: 15px; font-weight: 800; color: #f8fafc; margin-top: 4px; display: flex; align-items: center; justify-content: space-between; }
    .line-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

    /* Individual Line Card */
    .line-card { background: #1e293b; padding: 14px; border-radius: 14px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s, border-color 0.2s; }
    .line-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    
    .line-card-header { display: flex; justify-content: space-between; align-items: center; }
    .line-name { font-size: 16px; font-weight: 800; color: #38bdf8; }
    
    .status-badge { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
    .status-good { background: #065f46; color: #34d399; }
    .status-warning { background: #881337; color: #fda4af; }
    .status-neutral { background: #334155; color: #94a3b8; }

    /* Progress Bar inside Line Card */
    .progress-bg { background: #0f172a; height: 10px; border-radius: 5px; overflow: hidden; border: 1px solid #334155; }
    .progress-fill { height: 100%; background: #10b981; transition: width 0.4s ease; }
    .progress-fill.low { background: #f43f5e; }

    /* Mini Metric Row */
    .mini-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
    .mini-box { background: #0f172a; padding: 6px 4px; border-radius: 8px; border: 1px solid #334155; }
    .mini-title { font-size: 9px; color: #94a3b8; font-weight: bold; }
    .mini-val { font-size: 13px; font-weight: 800; margin-top: 2px; }

    /* Form Section */
    .mobile-form { background: #1e293b; padding: 16px; border-radius: 16px; border: 1px solid #334155; }
    .form-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #38bdf8; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 4px; }
    .form-group select, .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px; font-weight: bold; outline: none; }

    .btn-submit { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 6px; background: #0284c7; color: #fff; }
    .btn-submit:hover { background: #0369a1; }

    #loadingOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; color: #fff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="hidden">
    <div style="background: #1e293b; color: #fff; padding: 20px 30px; border-radius: 12px; text-align: center; border: 1px solid #334155;">
      <p style="font-weight: bold; font-size: 14px;">🔄 กำลังโหลดข้อมูลสถานะ Plan / Actual...</p>
    </div>
  </div>

  <div class="container">
    
    <!-- Header -->
    <div class="header">
      <div>
        <h1>📊 Plan vs Actual Summary</h1>
        <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">เปรียบเทียบสถานะการผลิตแยกตาม Line</p>
      </div>
      <button onclick="loadData()" class="btn-refresh">🔄 รีเฟรช</button>
    </div>

    <!-- Overall Total Overview -->
    <div class="overview-card">
      <div class="overview-title">🌐 สรุปรวมทุกสายการผลิต (Grand Total)</div>
      <div class="overview-grid">
        <div class="total-card">
          <div class="total-title">🎯 Total Plan</div>
          <div id="grandPlan" class="total-val" style="color: #38bdf8;">0</div>
        </div>
        <div class="total-card">
          <div class="total-title">⚙️ Total Actual</div>
          <div id="grandActual" class="total-val" style="color: #34d399;">0</div>
        </div>
        <div class="total-card">
          <div class="total-title">❌ Total Defect</div>
          <div id="grandDefect" class="total-val" style="color: #f43f5e;">0</div>
        </div>
        <div class="total-card">
          <div class="total-title">📈 Overall Progress</div>
          <div id="grandProgress" class="total-val" style="color: #fbbf24;">0%</div>
        </div>
      </div>
    </div>

    <!-- Section Title -->
    <div class="section-title">
      <span>🏭 สถานะรายไลน์ (Line Breakdown)</span>
    </div>

    <!-- Cards Grid for Lines -->
    <div class="line-grid" id="lineCardsContainer">
      <!-- Cards generated by JS -->
    </div>

    <!-- Form บันทึก/อัปเดตข้อมูล Quick Entry -->
    <div class="mobile-form">
      <div class="form-title">📝 บันทึกข้อมูล Quick Plan / Actual</div>
      <form id="entryForm" onsubmit="submitData(event)">
        
        <div class="form-row">
          <div class="form-group">
            <label>สายการผลิต (Line)</label>
            <select id="lineSelect" required>
              <option value="Line A">Line A</option>
              <option value="Line Q">Line Q</option>
              <option value="Line C1">Line C1</option>
              <option value="Line C2">Line C2</option>
              <option value="Line C3">Line C3</option>
            </select>
          </div>
          <div class="form-group">
            <label>ประเภทบันทึก</label>
            <select id="entryType" onchange="toggleFormInputs()" required>
              <option value="PLAN">📌 เพิ่ม/วางแผน (Plan)</option>
              <option value="ACTUAL">💾 บันทึกผลผลิต (Actual)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Part No.</label>
            <input type="text" id="partNoInput" placeholder="เช่น Part-01" required>
          </div>
          <div class="form-group">
            <label>Lot No.</label>
            <input type="text" id="lotNoInput" placeholder="เช่น L6907-01" required>
          </div>
        </div>

        <div class="form-row" id="planInputs">
          <div class="form-group" style="grid-column: span 2;">
            <label>จำนวนแผน (Plan Pcs)</label>
            <input type="number" id="planQtyInput" placeholder="0" inputmode="numeric">
          </div>
        </div>

        <div class="form-row hidden" id="actualInputs">
          <div class="form-group">
            <label>ผลิตได้จริง (Actual Pcs)</label>
            <input type="number" id="actualQtyInput" placeholder="0" inputmode="numeric">
          </div>
          <div class="form-group">
            <label>ของเสีย (Defect Pcs)</label>
            <input type="number" id="defectQtyInput" value="0" placeholder="0" inputmode="numeric">
          </div>
        </div>

        <div class="form-group">
          <label>ชื่อผู้บันทึก</label>
          <input type="text" id="reporterName" placeholder="ระบุชื่อของคุณ" required>
        </div>

        <button type="submit" class="btn-submit">💾 บันทึกข้อมูล</button>
      </form>
    </div>

  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvRMB7WABmzkV461dRTFiU8t-syZ2ivrhRAu2JuDb2PxCUP9XkEjUqsOWJ7BD76xGu/exec";

    // อัปเดตรายชื่อ Line เอา Line L5KOT ออกแล้วครับ
    const ALL_LINES = ["Line A", "Line Q", "Line C1", "Line C2", "Line C3"];
    let rawLogs = [];

    function showLoading(show) {
      document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
    }

    function toggleFormInputs() {
      const type = document.getElementById('entryType').value;
      if (type === 'PLAN') {
        document.getElementById('planInputs').classList.remove('hidden');
        document.getElementById('actualInputs').classList.add('hidden');
        document.getElementById('planQtyInput').required = true;
        document.getElementById('actualQtyInput').required = false;
      } else {
        document.getElementById('planInputs').classList.add('hidden');
        document.getElementById('actualInputs').classList.remove('hidden');
        document.getElementById('planQtyInput').required = false;
        document.getElementById('actualQtyInput').required = true;
      }
    }

    async function loadData() {
      showLoading(true);
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?module=production`, { method: 'GET', redirect: 'follow' });
        rawLogs = await res.json();
        renderDashboard();
      } catch (err) {
        alert("❌ เกิดข้อผิดพลาดในการดึงข้อมูล");
      } finally {
        showLoading(false);
      }
    }

    function renderDashboard() {
      const lineMap = {};
      ALL_LINES.forEach(line => {
        lineMap[line] = { plan: 0, actual: 0, defect: 0 };
      });

      let gPlan = 0, gActual = 0, gDefect = 0;

      rawLogs.forEach(item => {
        const lName = item.line;
        // จะคำนวณและแสดงผลเฉพาะ Line ที่อยู่ในรายชื่อ ALL_LINES เท่านั้น
        if (lineMap[lName]) {
          const p = Number(item.planQty) || 0;
          const a = Number(item.actualQty) || 0;
          const d = Number(item.defectQty) || 0;

          lineMap[lName].plan += p;
          lineMap[lName].actual += a;
          lineMap[lName].defect += d;

          gPlan += p;
          gActual += a;
          gDefect += d;
        }
      });

      // Render Grand Totals
      document.getElementById('grandPlan').innerText = gPlan.toLocaleString();
      document.getElementById('grandActual').innerText = gActual.toLocaleString();
      document.getElementById('grandDefect').innerText = gDefect.toLocaleString();
      const gPct = gPlan > 0 ? Math.round((gActual / gPlan) * 100) : 0;
      document.getElementById('grandProgress').innerText = `${gPct}%`;

      // Render Cards
      const container = document.getElementById('lineCardsContainer');
      container.innerHTML = '';

      Object.keys(lineMap).forEach(lineName => {
        const data = lineMap[lineName];
        const pct = data.plan > 0 ? Math.round((data.actual / data.plan) * 100) : 0;
        const balance = data.plan - data.actual;

        let statusText = 'Normal';
        let statusClass = 'status-good';

        if (data.plan === 0) {
          statusText = 'No Plan';
          statusClass = 'status-neutral';
        } else if (pct < 80) {
          statusText = 'Delay';
          statusClass = 'status-warning';
        }

        const isLow = pct < 80 && data.plan > 0;

        const card = document.createElement('div');
        card.className = 'line-card';
        card.innerHTML = `
          <div class="line-card-header">
            <span class="line-name">${lineName}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>

          <div class="progress-bg">
            <div class="progress-fill ${isLow ? 'low' : ''}" style="width: ${Math.min(pct, 100)}%;"></div>
          </div>

          <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8;">
            <span>ความคืบหน้า</span>
            <b style="color: ${isLow ? '#f43f5e' : '#34d399'};">${pct}%</b>
          </div>

          <div class="mini-metrics">
            <div class="mini-box">
              <div class="mini-title">🎯 Plan</div>
              <div class="mini-val" style="color: #38bdf8;">${data.plan.toLocaleString()}</div>
            </div>
            <div class="mini-box">
              <div class="mini-title">⚙️ Actual</div>
              <div class="mini-val" style="color: #34d399;">${data.actual.toLocaleString()}</div>
            </div>
            <div class="mini-box">
              <div class="mini-title">⚖️ Balance</div>
              <div class="mini-val" style="color: #fbbf24;">${balance.toLocaleString()}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function submitData(e) {
      e.preventDefault();
      showLoading(true);

      const today = new Date().toISOString().split('T')[0];
      const type = document.getElementById('entryType').value;
      const selectedLine = document.getElementById('lineSelect').value;
      const reporter = document.getElementById('reporterName').value;

      let payload = {
        line: selectedLine,
        planPartNo: document.getElementById('partNoInput').value,
        actualPartNo: document.getElementById('partNoInput').value,
        planLotNo: document.getElementById('lotNoInput').value,
        actualLotNo: document.getElementById('lotNoInput').value
      };

      if (type === 'PLAN') {
        payload.planStartDate = today;
        payload.planEndDate = today;
        payload.planQty = document.getElementById('planQtyInput').value;
        payload.planner = `[Planner] ${reporter}`;
      } else {
        payload.actualStartDate = today;
        payload.actualEndDate = today;
        payload.actualQty = document.getElementById('actualQtyInput').value;
        payload.defectQty = document.getElementById('defectQtyInput').value;
        payload.operator = `[Operator] ${reporter}`;
      }

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "addProductionLog", data: payload })
        });

        document.getElementById('entryForm').reset();
        setTimeout(loadData, 1500);
        alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว!");
      } catch (err) {
        alert("❌ ไม่สามารถบันทึกข้อมูลได้");
        showLoading(false);
      }
    }

    window.onload = () => {
      toggleFormInputs();
      loadData();
    };
  </script>
</body>
</html>
